name: Cleanup Cache and Workflow Runs

on:
  schedule:
    # Chạy tự động vào 00:00 mỗi ngày
    - cron: '0 0 * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write   # Cần thiết để xóa cache và workflow runs
      contents: read

    steps:
      # ==========================================
      # BƯỚC 1: XÓA CACHE (Giữ lại 1 cái mới nhất)
      # ==========================================
      - name: Cleanup Caches (Keep 1 latest)
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "=== BẮT ĐẦU DỌN DẸP CACHE ==="
          
          # Lấy danh sách cache, sắp xếp từ mới nhất đến cũ nhất
          # Lấy từ phần tử thứ 2 trở đi để xóa (index .[1:])
          CACHE_IDS=$(gh api repos/$REPO/actions/caches --paginate \
            --jq '.actions_caches | sort_by(.created_at) | reverse | .[1:] | .[].id' 2>/dev/null || true)

          if [ -z "$CACHE_IDS" ]; then
            echo "Không có cache cũ nào cần xóa (Tổng số cache <= 1)."
          else
            for CACHE_ID in $CACHE_IDS; do
              echo "Đang xóa cache ID: $CACHE_ID"
              gh api --method DELETE repos/$REPO/actions/caches/$CACHE_ID
            done
            echo "Đã xóa xong các cache cũ!"
          fi

      # =========================================================================
      # BƯỚC 2: XÓA WORKFLOW RUNS (Chỉ giữ lại 1 run THÀNH CÔNG mới nhất)
      # =========================================================================
      - name: Cleanup Workflow Runs (Keep 1 latest successful run)
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          echo "=== BẮT ĐẦU DỌN DẸP WORKFLOW RUNS ==="

          # 1. Tìm ID của Run THÀNH CÔNG mới nhất (Không tính lượt chạy hiện tại)
          LATEST_SUCCESS_ID=$(gh api "repos/$REPO/actions/runs?status=success&per_page=10" \
            --jq ".workflow_runs[] | select(.id != $CURRENT_RUN_ID) | .id" | head -n 1 || true)

          if [ -n "$LATEST_SUCCESS_ID" ]; then
            echo "Tìm thấy Workflow Run thành công gần nhất cần giữ lại: ID $LATEST_SUCCESS_ID"
          else
            echo "Không tìm thấy run thành công nào trước đó để giữ lại."
          fi

          # 2. Lấy danh sách TẤT CẢ các Workflow Runs cũ (Loại trừ run hiện tại và run thành công cần giữ)
          RUNS_TO_DELETE=$(gh api repos/$REPO/actions/runs --paginate \
            --jq ".workflow_runs[] | select(.id != $CURRENT_RUN_ID and .id != ${LATEST_SUCCESS_ID:-0}) | .id")

          if [ -z "$RUNS_TO_DELETE" ]; then
            echo "Không có Workflow Runs cũ nào cần xóa."
          else
            echo "Đang tiến hành xóa các Workflow Runs cũ..."
            for RUN_ID in $RUNS_TO_DELETE; do
              echo "Đang xóa Workflow Run ID: $RUN_ID"
              gh api --method DELETE repos/$REPO/actions/runs/$RUN_ID
            done
            echo "Dọn dẹp Workflow Runs hoàn tất!"
          fi
          
